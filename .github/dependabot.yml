version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/site"
      - "/scripts"
      - "/workers/*"
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Sydney
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
